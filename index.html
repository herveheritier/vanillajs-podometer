<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Accéléromètre — variations</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #131a23;
    --line: #1f2a37;
    --txt: #e6edf3;
    --dim: #7d8b9a;
    --x: #ff5c7a;
    --y: #4ade80;
    --z: #4da3ff;
    --accent: #ffb020;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--txt);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    letter-spacing: .2px;
  }
  h1 small { display: block; font-size: 10px; color: var(--dim); font-weight: 400; letter-spacing: .4px; text-transform: uppercase; }
  .badge {
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    padding: 4px 9px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #0f151d;
    color: var(--dim);
    white-space: nowrap;
  }
  .badge.on { color: #04130a; background: var(--y); border-color: var(--y); }
  .badge.err { color: #2b0a0e; background: var(--x); border-color: var(--x); }
  .hstat { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .ver {
    font-size: 10px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    letter-spacing: .4px;
  }

  main { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 10px 14px; min-height: 0; overflow-y: auto; }

  .sensors { display: flex; gap: 6px; }
  .sensors .seg {
    flex: 1;
    padding: 7px 10px;
    font-size: 11px;
    font-weight: 600;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--dim);
    cursor: pointer;
  }
  .sensors .seg.on { background: var(--accent); border-color: var(--accent); color: #1a1200; }

  .curvepick { align-items: center; }
  .clab {
    font-size: 10px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: .5px;
    white-space: nowrap;
  }
  .curvepick .seg { padding: 6px 8px; font-size: 10px; }

  .smoothrow { display: flex; align-items: center; gap: 8px; }
  .smoothrow input[type="range"] {
    flex: 1;
    min-width: 0;
    height: 20px;
    margin: 0;
    accent-color: var(--accent);
  }
  #smoothval {
    font-size: 10px;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    min-width: 34px;
    text-align: right;
  }

  .axes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .axis {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 10px;
    position: relative;
    overflow: hidden;
  }
  .axis::before {
    content: "";
    position: absolute; inset: 0 auto 0 0; width: 3px;
    background: currentColor;
    opacity: .9;
  }
  .axis .k { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; }
  .axis .v {
    font-size: 19px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    color: currentColor;
    margin-top: 2px;
    line-height: 1.25;
  }
  .axis .d { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #axX { color: var(--x); } #axY { color: var(--y); } #axZ { color: var(--z); }
  .axis .d, .axis .k { color: var(--dim); }

  .summary {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px;
  }
  .cell .k { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; }
  .cell .v { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

  canvas { width: 100%; height: 120px; display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }

  .logwrap {
    flex: 1;
    min-height: 90px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .loghead {
    display: grid;
    grid-template-columns: 1.15fr 1fr 1fr 1fr 1fr;
    gap: 4px;
    padding: 7px 10px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--dim);
    border-bottom: 1px solid var(--line);
  }
  .log { flex: 1; overflow-y: auto; font-variant-numeric: tabular-nums; }
  .row {
    display: grid;
    grid-template-columns: 1.15fr 1fr 1fr 1fr 1fr;
    gap: 4px;
    padding: 5px 10px;
    font-size: 12px;
    border-bottom: 1px solid rgba(31, 42, 55, .55);
  }
  .row:nth-child(2) { background: #17202b; }
  .row span { text-align: right; }
  .row span:first-child { text-align: left; color: var(--dim); }
  .row .mx { color: var(--x); } .row .my { color: var(--y); } .row .mz { color: var(--z); }
  .row .mm { color: var(--accent); }

  footer { display: flex; gap: 8px; padding: 0 14px calc(10px + env(safe-area-inset-bottom)); }
  button {
    flex: 1;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 13px 10px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--txt);
    cursor: pointer;
  }
  button:active { transform: scale(.99); }
  #start { background: var(--accent); border-color: var(--accent); color: #1a1200; }
  #start.stop { background: var(--x); border-color: var(--x); color: #26060b; }
  #start:disabled { opacity: .55; }

  .empty { padding: 14px; font-size: 12px; color: var(--dim); line-height: 1.5; }
  code { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1><span id="title">Accéléromètre</span><small>variations en direct</small></h1>
  <div class="hstat">
    <span class="badge" id="status">inactif</span>
    <!-- version : incrémenter à chaque évolution poussée sur le dépôt -->
    <span class="ver" id="version">v6</span>
  </div>
</header>

<main>
  <div class="sensors">
    <button type="button" class="seg on" id="segAccel" aria-pressed="true">Accéléromètre</button>
    <button type="button" class="seg" id="segGyro" aria-pressed="false">Gyroscope</button>
    <button type="button" class="seg" id="segBoth" aria-pressed="false">Combiné</button>
  </div>

  <div class="axes">
    <div class="axis" id="axX"><div class="k">X</div><div class="v" id="vx">—</div><div class="d" id="dx">Δ —</div></div>
    <div class="axis" id="axY"><div class="k">Y</div><div class="v" id="vy">—</div><div class="d" id="dy">Δ —</div></div>
    <div class="axis" id="axZ"><div class="k">Z</div><div class="v" id="vz">—</div><div class="d" id="dz">Δ —</div></div>
  </div>

  <div class="summary">
    <div class="cell"><div class="k">Norme</div><div class="v" id="vmag">—</div></div>
    <div class="cell"><div class="k">Δ variation</div><div class="v" id="vdelta">—</div></div>
    <div class="cell"><div class="k">Échantillons</div><div class="v" id="vcount">0</div></div>
  </div>

  <canvas id="chart" width="600" height="240"></canvas>

  <div class="sensors curvepick">
    <span class="clab">Courbe jaune</span>
    <button type="button" class="seg on" id="curveAvg" aria-pressed="true">Moyenne</button>
    <button type="button" class="seg" id="curveMax" aria-pressed="false">Amplitude</button>
  </div>

  <div class="smoothrow">
    <span class="clab">Lissage</span>
    <input type="range" id="smooth" min="0" max="90" step="5" value="0" aria-label="Facteur de lissage des courbes">
    <span id="smoothval">0 %</span>
  </div>

  <div class="logwrap">
    <div class="loghead"><span>temps</span><span>X</span><span>Y</span><span>Z</span><span id="hsym">|a|</span></div>
    <div class="log" id="log">
      <div class="empty" id="hint">
        Appuie sur <b>Démarrer</b> puis accepte la demande de capteur de mouvement.
        Les données arrivent uniquement après interaction (obligatoire sur Android et iOS).
      </div>
    </div>
  </div>
</main>

<footer>
  <button id="start">Démarrer</button>
  <button id="reset">Réinitialiser</button>
</footer>

<script>
(function () {
  'use strict';

  var MAX_SAMPLES = 240;      // points conservés pour le graphe
  var MAX_ROWS = 150;         // lignes conservées dans le journal

  var el = {
    status: document.getElementById('status'),
    vx: document.getElementById('vx'), vy: document.getElementById('vy'), vz: document.getElementById('vz'),
    dx: document.getElementById('dx'), dy: document.getElementById('dy'), dz: document.getElementById('dz'),
    vmag: document.getElementById('vmag'), vdelta: document.getElementById('vdelta'), vcount: document.getElementById('vcount'),
    start: document.getElementById('start'), reset: document.getElementById('reset'),
    log: document.getElementById('log'), hint: document.getElementById('hint'),
    chart: document.getElementById('chart'),
    segAccel: document.getElementById('segAccel'), segGyro: document.getElementById('segGyro'),
    segBoth: document.getElementById('segBoth'),
    title: document.getElementById('title'), hsym: document.getElementById('hsym'),
    curveAvg: document.getElementById('curveAvg'), curveMax: document.getElementById('curveMax'),
    smooth: document.getElementById('smooth'), smoothval: document.getElementById('smoothval')
  };
  var ctx = el.chart.getContext('2d');

  var running = false;
  var samples = [];          // {t, x, y, z, mag, avg, amp}
  var prev = null;           // échantillon précédent
  var total = 0;
  var t0 = 0;               // horodatage du premier échantillon (log relatif)
  var dirty = false;
  var lastEventTs = 0;
  var rate = { count: 0, since: 0 };
  var listenTs = 0;

  var sensor = 'accel';                           // 'accel' | 'gyro' | 'both'
  var gyroMode = 1;                               // 1 = vitesses angulaires, 2 = cumul par composante
  var curveMode = 'avg';                          // courbe jaune : 'avg' = moyenne, 'amp' = plus grande amplitude
  var smoothing = 0;                              // 0 = courbes brutes, jusqu'à 0.9 = très lissées
  var gyroSum = { x: 0, y: 0, z: 0 };             // totaux du mode cumul
  var gyroSensor = null;
  var lastOrient = null;

  function fmt(n) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    var s = n.toFixed(2);
    return (n >= 0 ? '+' : '') + s;
  }

  function setStatus(text, cls) {
    el.status.textContent = text;
    el.status.className = 'badge' + (cls ? ' ' + cls : '');
  }

  function motionAvailable() {
    return 'DeviceMotionEvent' in window;
  }

  /* ---------- capture ---------- */

  function onMotion(e) {
    var a = e.accelerationIncludingGravity || e.acceleration;
    if (!a || (a.x === null && a.y === null && a.z === null)) return;
    var x = a.x || 0, y = a.y || 0, z = a.z || 0;
    var raw = e.timeStamp || (window.performance && performance.now ? performance.now() : Date.now());
    ingest(x, y, z, raw, false);
  }

  function onGyroReading() {
    if (!gyroSensor) return;
    var raw = window.performance && performance.now ? performance.now() : Date.now();
    ingest(gyroSensor.x || 0, gyroSensor.y || 0, gyroSensor.z || 0, raw, true);
  }

  // repli si l'API Gyroscope n'existe pas : vitesse dérivée de l'orientation
  function onOrient(e) {
    if (e.beta === null && e.gamma === null) return;
    var raw = e.timeStamp || (window.performance && performance.now ? performance.now() : Date.now());
    if (lastOrient) {
      var dt = (raw - lastOrient.t) / 1000;
      if (dt > 0.001 && dt < 0.5) {
        var a0 = e.alpha === null ? 0 : e.alpha;
        var b0 = lastOrient.a === null ? 0 : lastOrient.a;
        ingest((e.beta - lastOrient.b) / dt, (e.gamma - lastOrient.g) / dt,
               (((a0 - b0) + 540) % 360 - 180) / dt, raw, true);
        lastOrient = { t: raw, b: e.beta, g: e.gamma, a: e.alpha };
        return;
      }
    }
    lastOrient = { t: raw, b: e.beta, g: e.gamma, a: e.alpha };
  }

  function ingest(x, y, z, raw, isGyro) {
    if (!t0) t0 = raw;

    // en mode combiné, les vitesses angulaires ne s'affichent pas
    if (isGyro && sensor !== 'gyro') return;

    // second mode du gyroscope : chaque composante se cumule à elle-même
    if (isGyro && gyroMode === 2) {
      gyroSum.x += x; gyroSum.y += y; gyroSum.z += z;
      x = gyroSum.x; y = gyroSum.y; z = gyroSum.z;
    }

    var mag = Math.sqrt(x * x + y * y + z * z);

    var s = {
      t: raw - t0,
      x: x, y: y, z: z, mag: mag,
      avg: (x + y + z) / 3,
      amp: Math.max(Math.abs(x), Math.abs(y), Math.abs(z)),
      d: prev ? mag - prev.mag : 0,
      dx: prev ? x - prev.x : 0,
      dy: prev ? y - prev.y : 0,
      dz: prev ? z - prev.z : 0
    };

    prev = s;
    samples.push(s);
    if (samples.length > MAX_SAMPLES) samples.shift();
    total++;
    s.n = total;
    dirty = true;

    lastEventTs = Date.now();
    rate.count++;
    if (!rate.since) rate.since = lastEventTs;
  }

  /* ---------- rendu ---------- */

  function drawChart() {
    var w = el.chart.width, h = el.chart.height;
    var pad = 8;
    ctx.clearRect(0, 0, w, h);

    // grille zéro
    ctx.strokeStyle = 'rgba(125,139,154,.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, h / 2);
    ctx.lineTo(w, h / 2);
    ctx.stroke();

    if (samples.length < 2) return;

    var n = samples.length;

    // lissage instantané : moyenne mobile exponentielle sur chaque composante
    var k = 1 - smoothing;
    var xs = [], ys = [], zs = [], ctrl = [];
    var sx = samples[0].x, sy = samples[0].y, sz = samples[0].z;
    for (var i = 0; i < n; i++) {
      if (i > 0) {
        sx += (samples[i].x - sx) * k;
        sy += (samples[i].y - sy) * k;
        sz += (samples[i].z - sz) * k;
      }
      xs.push(sx); ys.push(sy); zs.push(sz);
      ctrl.push(curveMode === 'amp'
        ? Math.max(Math.abs(sx), Math.abs(sy), Math.abs(sz))
        : (sx + sy + sz) / 3);
    }

    var maxAbs = 1;
    for (var m = 0; m < n; m++) {
      maxAbs = Math.max(maxAbs, Math.abs(xs[m]), Math.abs(ys[m]), Math.abs(zs[m]), Math.abs(ctrl[m]));
    }
    maxAbs = Math.ceil(maxAbs * 1.1);

    var stepX = (w - pad * 2) / (n - 1);
    var scale = (h - pad * 2) / 2 / maxAbs;
    var mid = h / 2;

    // pics de la courbe de contrôle : un trait vertical à chaque maximum marqué
    var ctrlMax = 0;
    for (var c = 0; c < n; c++) ctrlMax = Math.max(ctrlMax, Math.abs(ctrl[c]));
    var peakLevel = ctrlMax * 0.7;
    var PEAK_WINDOW = 6;                  // échantillons comparés de part et d'autre
    var PEAK_SPACING = 8;                 // écart minimal entre deux traits
    var lastPeak = -1e9;
    ctx.strokeStyle = 'rgba(245,196,81,.5)';
    ctx.lineWidth = 1;
    for (var p = 1; p < n - 1; p++) {
      var pv = Math.abs(ctrl[p]);
      if (pv < peakLevel || p - lastPeak < PEAK_SPACING) continue;
      var isPeak = true;
      for (var q = Math.max(0, p - PEAK_WINDOW); q <= Math.min(n - 1, p + PEAK_WINDOW); q++) {
        if (Math.abs(ctrl[q]) > pv) { isPeak = false; break; }
      }
      if (!isPeak) continue;
      var peakX = pad + p * stepX;
      ctx.beginPath();
      ctx.moveTo(peakX, 0);
      ctx.lineTo(peakX, h);
      ctx.stroke();
      lastPeak = p;
    }

    var series = [
      { vals: xs, color: '#ff5c7a' },
      { vals: ys, color: '#4ade80' },
      { vals: zs, color: '#4da3ff' },
      { vals: ctrl, color: '#f5c451' }
    ];
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    for (var t = 0; t < series.length; t++) {
      var vals = series[t].vals;
      ctx.strokeStyle = series[t].color;
      ctx.beginPath();
      for (var j = 0; j < n; j++) {
        var px = pad + j * stepX;
        var py = mid - vals[j] * scale;
        if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
  }

  var lastRowTotal = 0;

  function render() {
    if (dirty && samples.length) {
      dirty = false;
      var last = samples[samples.length - 1];

      el.vx.textContent = fmt(last.x);
      el.vy.textContent = fmt(last.y);
      el.vz.textContent = fmt(last.z);
      el.dx.textContent = 'Δ ' + fmt(last.dx);
      el.dy.textContent = 'Δ ' + fmt(last.dy);
      el.dz.textContent = 'Δ ' + fmt(last.dz);
      el.vmag.textContent = fmt(last.mag).replace('+', '') + unitLabel();
      el.vdelta.textContent = fmt(last.d);
      el.vcount.textContent = total.toLocaleString('fr-FR');

      drawChart();
    }

    // journal : n'ajoute que les échantillons pas encore affichés
    if (total !== lastRowTotal) {
      var fresh = [];
      for (var i = samples.length - 1; i >= 0; i--) {
        if (samples[i].n <= lastRowTotal) break;
        fresh.push(samples[i]);
      }
      fresh.reverse(); // du plus ancien au plus récent
      for (var f = 0; f < fresh.length; f++) {
        var s = fresh[f];
        var row = document.createElement('div');
        row.className = 'row';
        row.innerHTML =
          '<span>' + (s.t / 1000).toFixed(2) + 's</span>' +
          '<span class="mx">' + fmt(s.x) + '</span>' +
          '<span class="my">' + fmt(s.y) + '</span>' +
          '<span class="mz">' + fmt(s.z) + '</span>' +
          '<span class="mm">' + s.mag.toFixed(2) + '</span>';
        el.log.insertBefore(row, el.log.firstChild);
      }
      if (fresh.length) {
        if (el.hint.parentNode) el.hint.parentNode.removeChild(el.hint);
        var rows = el.log.querySelectorAll('.row');
        for (var r = MAX_ROWS; r < rows.length; r++) rows[r].remove();
        el.log.scrollTop = 0;
      }
      lastRowTotal = total;
    }

    requestAnimationFrame(render);
  }

  function tickRate() {
    if (!running) return;
    var now = Date.now();
    var span = now - rate.since;
    var hz = span > 300 ? (rate.count * 1000 / span) : 0;
    if (hz > 0) setStatus(Math.round(hz) + ' Hz', 'on');
    rate.count = 0;
    rate.since = now;

    if (now - lastEventTs > 2000 && lastEventTs > 0) {
      setStatus('aucune donnée', '');
    } else if (now - listenTs > 2500 && lastEventTs === 0) {
      setStatus('capteur muet', 'err');
      el.hint.innerHTML =
        'Aucun événement reçu. Le capteur de mouvement du navigateur exige une page <b>HTTPS</b> ou <code>localhost</code>. ' +
        'Si tu ouvres le fichier en <code>file://</code>, sers-le avec <code>npx serve</code> ou <code>python3 -m http.server</code>.';
    }
  }

  /* ---------- contrôle ---------- */

  function requestPermission() {
    var DME = window.DeviceMotionEvent;
    if (DME && typeof DME.requestPermission === 'function') {
      return DME.requestPermission();
    }
    return Promise.resolve('granted');
  }

  function start() {
    if (!motionAvailable()) {
      setStatus('non supporté', 'err');
      el.hint.innerHTML = 'Ce navigateur ne fournit pas <code>DeviceMotionEvent</code>. Ouvre la page dans Chrome sur Android.';
      return;
    }
    el.start.disabled = true;
    requestPermission().then(function (state) {
      el.start.disabled = false;
      if (state !== 'granted') {
        setStatus('refusé', 'err');
        return;
      }
      listenTs = Date.now();
      lastEventTs = 0;
      rate.since = 0;
      attachSource();
      running = true;
      el.start.textContent = 'Arrêter';
      el.start.classList.add('stop');
      setStatus('en attente…', '');
      tickInterval = setInterval(tickRate, 1000);
    }).catch(function () {
      el.start.disabled = false;
      setStatus('erreur', 'err');
    });
  }

  var tickInterval = null;

  function attachGyro() {
    var G = window.Gyroscope;
    if (G) {
      try {
        gyroSensor = new G({ frequency: 60 });
        gyroSensor.addEventListener('reading', onGyroReading);
        gyroSensor.addEventListener('error', function () {
          gyroSensor = null;
          if ('DeviceOrientationEvent' in window) window.addEventListener('deviceorientation', onOrient, { passive: true });
        });
        gyroSensor.start();
        return;
      } catch (err) {
        gyroSensor = null;
      }
    }
    if ('DeviceOrientationEvent' in window) {
      window.addEventListener('deviceorientation', onOrient, { passive: true });
    }
  }

  function attachSource() {
    if (sensor === 'gyro') {
      attachGyro();
      return;
    }
    window.addEventListener('devicemotion', onMotion, { passive: true });
    if (sensor === 'both') attachGyro();
  }

  function detachSource() {
    window.removeEventListener('devicemotion', onMotion);
    window.removeEventListener('deviceorientation', onOrient);
    if (gyroSensor) {
      try { gyroSensor.stop(); } catch (err) {}
      gyroSensor = null;
    }
    lastOrient = null;
  }

  function unitLabel() {
    if (sensor !== 'gyro') return ' m/s²';
    return gyroMode === 2 ? ' cumul' : ' °/s';
  }

  function syncLabels() {
    var segs = [['accel', el.segAccel], ['gyro', el.segGyro], ['both', el.segBoth]];
    for (var i = 0; i < segs.length; i++) {
      var on = segs[i][0] === sensor;
      segs[i][1].className = 'seg' + (on ? ' on' : '');
      if (segs[i][1].setAttribute) segs[i][1].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    el.segGyro.textContent = (sensor === 'gyro' && gyroMode === 2) ? 'Gyroscope Σ' : 'Gyroscope';
    el.title.textContent = sensor === 'accel' ? 'Accéléromètre'
      : (sensor === 'both' ? 'Accéléromètre + gyroscope'
        : (gyroMode === 2 ? 'Gyroscope — cumul' : 'Gyroscope'));
    el.hsym.textContent = sensor === 'gyro' ? (gyroMode === 2 ? 'Σ' : '|ω|') : '|a|';
  }

  function setSensor(mode) {
    if (sensor === mode) return;
    var wasRunning = running;
    if (wasRunning) stop();
    sensor = mode;
    syncLabels();
    reset();
    setStatus('inactif', '');
    if (wasRunning) start();
  }

  // appui sur le bouton Gyroscope alors qu'il est déjà actif : change de mode
  function setGyroMode(mode) {
    if (gyroMode === mode) return;
    var wasRunning = running;
    if (wasRunning) stop();
    gyroMode = mode;
    gyroSum = { x: 0, y: 0, z: 0 };
    syncLabels();
    reset();
    setStatus('inactif', '');
    if (wasRunning) start();
  }

  // courbe jaune : moyenne des 3 composantes ou plus grande amplitude
  function setCurveMode(mode) {
    if (curveMode === mode) return;
    curveMode = mode;
    el.curveAvg.className = 'seg' + (mode === 'avg' ? ' on' : '');
    el.curveMax.className = 'seg' + (mode === 'amp' ? ' on' : '');
    el.curveAvg.setAttribute('aria-pressed', mode === 'avg' ? 'true' : 'false');
    el.curveMax.setAttribute('aria-pressed', mode === 'amp' ? 'true' : 'false');
    drawChart();
  }

  function stop() {
    detachSource();
    running = false;
    el.start.textContent = 'Démarrer';
    el.start.classList.remove('stop');
    setStatus('en pause', '');
    if (tickInterval) { clearInterval(tickInterval); tickInterval = null; }
  }

  function reset() {
    samples = [];
    prev = null;
    gyroSum = { x: 0, y: 0, z: 0 };
    total = 0;
    t0 = 0;
    lastRowTotal = 0;
    el.log.querySelectorAll('.row').forEach(function (r) { r.remove(); });
    el.vx.textContent = el.vy.textContent = el.vz.textContent = '—';
    el.dx.textContent = el.dy.textContent = el.dz.textContent = 'Δ —';
    el.vmag.textContent = el.vdelta.textContent = '—';
    el.vcount.textContent = '0';
    dirty = false;
    lastOrient = null;
    drawChart();
  }

  el.start.addEventListener('click', function () {
    if (running) stop(); else start();
  });
  el.reset.addEventListener('click', reset);

  if (!motionAvailable()) {
    setStatus('indisponible', 'err');
  }
  el.segAccel.addEventListener('click', function () { setSensor('accel'); });
  el.segGyro.addEventListener('click', function () {
    if (sensor === 'gyro') setGyroMode(gyroMode === 1 ? 2 : 1);
    else setSensor('gyro');
  });
  el.segBoth.addEventListener('click', function () { setSensor('both'); });
  el.curveAvg.addEventListener('click', function () { setCurveMode('avg'); });
  el.curveMax.addEventListener('click', function () { setCurveMode('amp'); });
  el.smooth.addEventListener('input', function () {
    smoothing = Number(el.smooth.value) / 100;
    el.smoothval.textContent = el.smooth.value + ' %';
    drawChart();
  });
  syncLabels();
  el.smoothval.textContent = el.smooth.value + ' %';
  drawChart();
  requestAnimationFrame(render);

  // installation et ouverture hors-ligne
  if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator &&
      typeof window !== 'undefined' && window.isSecureContext) {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
