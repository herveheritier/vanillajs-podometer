<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Accéléromètre — variations</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #131a23;
    --line: #1f2a37;
    --txt: #e6edf3;
    --dim: #7d8b9a;
    --x: #ff5c7a;
    --y: #4ade80;
    --z: #4da3ff;
    --accent: #ffb020;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--txt);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    letter-spacing: .2px;
  }
  h1 small { display: block; font-size: 10px; color: var(--dim); font-weight: 400; letter-spacing: .4px; text-transform: uppercase; }
  .badge {
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    padding: 4px 9px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #0f151d;
    color: var(--dim);
    white-space: nowrap;
  }
  .badge.on { color: #04130a; background: var(--y); border-color: var(--y); }
  .badge.err { color: #2b0a0e; background: var(--x); border-color: var(--x); }
  .hstat { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .ver {
    font-size: 10px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    letter-spacing: .4px;
  }

  main { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 10px 14px; min-height: 0; overflow-y: auto; }

  .sensors { display: flex; gap: 6px; }
  .sensors .seg {
    flex: 1;
    padding: 7px 10px;
    font-size: 11px;
    font-weight: 600;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--dim);
    cursor: pointer;
  }
  .sensors .seg.on { background: var(--accent); border-color: var(--accent); color: #1a1200; }

  .axes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .axis {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 10px;
    position: relative;
    overflow: hidden;
  }
  .axis::before {
    content: "";
    position: absolute; inset: 0 auto 0 0; width: 3px;
    background: currentColor;
    opacity: .9;
  }
  .axis .k { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; }
  .axis .v {
    font-size: 19px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    color: currentColor;
    margin-top: 2px;
    line-height: 1.25;
  }
  .axis .d { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #axX { color: var(--x); } #axY { color: var(--y); } #axZ { color: var(--z); }
  .axis .d, .axis .k { color: var(--dim); }

  .summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px;
  }
  .cell .k { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; }
  .cell .v { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .tunerow { display: flex; align-items: center; gap: 8px; }
  .clab {
    font-size: 10px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: .5px;
    white-space: nowrap;
  }
  .tunerow input[type="range"] {
    flex: 1;
    min-width: 0;
    height: 20px;
    margin: 0;
    accent-color: var(--accent);
  }
  #stepSensVal {
    font-size: 10px;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    min-width: 30px;
    text-align: right;
  }

  canvas { width: 100%; height: 120px; display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }

  footer { display: flex; gap: 8px; padding: 0 14px calc(10px + env(safe-area-inset-bottom)); }
  button {
    flex: 1;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 13px 10px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--txt);
    cursor: pointer;
  }
  button:active { transform: scale(.99); }
  #start { background: var(--accent); border-color: var(--accent); color: #1a1200; }
  #start.stop { background: var(--x); border-color: var(--x); color: #26060b; }
  #start:disabled { opacity: .55; }

  .empty { padding: 14px; font-size: 12px; color: var(--dim); line-height: 1.5; }
  code { color: var(--accent); }

  /* flash bref à chaque pas détecté */
  #flash {
    position: fixed;
    inset: 0;
    z-index: 9;
    pointer-events: none;
    background: var(--accent);
    opacity: 0;
    transition: opacity .3s ease;
  }
  #flash.on { opacity: .18; transition: opacity .03s linear; }
</style>
</head>
<body>
<div id="flash" aria-hidden="true"></div>
<header>
  <h1><span id="title">Accéléromètre</span><small>variations en direct</small></h1>
  <div class="hstat">
    <span class="badge" id="status">inactif</span>
    <!-- version : incrémenter à chaque évolution poussée sur le dépôt -->
    <span class="ver" id="version">v10</span>
  </div>
</header>

<main>
  <div class="sensors">
    <button type="button" class="seg on" id="segAccel" aria-pressed="true">Accéléromètre</button>
    <button type="button" class="seg" id="segGyro" aria-pressed="false">Gyroscope</button>
    <button type="button" class="seg" id="segBoth" aria-pressed="false">Combiné</button>
  </div>

  <div class="axes">
    <div class="axis" id="axX"><div class="k">X</div><div class="v" id="vx">—</div><div class="d" id="dx">Δ —</div></div>
    <div class="axis" id="axY"><div class="k">Y</div><div class="v" id="vy">—</div><div class="d" id="dy">Δ —</div></div>
    <div class="axis" id="axZ"><div class="k">Z</div><div class="v" id="vz">—</div><div class="d" id="dz">Δ —</div></div>
  </div>

  <div class="summary">
    <div class="cell"><div class="k">Norme</div><div class="v" id="vmag">—</div></div>
    <div class="cell"><div class="k">Δ variation</div><div class="v" id="vdelta">—</div></div>
    <div class="cell"><div class="k">Échantillons</div><div class="v" id="vcount">0</div></div>
    <div class="cell"><div class="k">Pas</div><div class="v" id="vsteps">0</div></div>
  </div>

  <div class="tunerow">
    <span class="clab">Sensibilité</span>
    <input type="range" id="stepSens" min="0" max="100" step="5" value="50" aria-label="Sensibilité de la détection de pas">
    <span id="stepSensVal">50</span>
  </div>

  <canvas id="chart" width="600" height="240"></canvas>

  <div class="empty" id="hint">
    Appuie sur <b>Démarrer</b> puis accepte la demande de capteur de mouvement.
    Les données arrivent uniquement après interaction (obligatoire sur Android et iOS).
  </div>
</main>

<footer>
  <button id="start">Démarrer</button>
  <button id="reset">Réinitialiser</button>
</footer>

<script>
(function () {
  'use strict';

  var MAX_SAMPLES = 240;      // points conservés pour le graphe

  var el = {
    status: document.getElementById('status'),
    vx: document.getElementById('vx'), vy: document.getElementById('vy'), vz: document.getElementById('vz'),
    dx: document.getElementById('dx'), dy: document.getElementById('dy'), dz: document.getElementById('dz'),
    vmag: document.getElementById('vmag'), vdelta: document.getElementById('vdelta'), vcount: document.getElementById('vcount'),
    vsteps: document.getElementById('vsteps'), flash: document.getElementById('flash'),
    stepSens: document.getElementById('stepSens'), stepSensVal: document.getElementById('stepSensVal'),
    start: document.getElementById('start'), reset: document.getElementById('reset'),
    hint: document.getElementById('hint'),
    chart: document.getElementById('chart'),
    segAccel: document.getElementById('segAccel'), segGyro: document.getElementById('segGyro'),
    segBoth: document.getElementById('segBoth'),
    title: document.getElementById('title')
  };
  var ctx = el.chart.getContext('2d');

  var running = false;
  var samples = [];          // {t, x, y, z, mag, step}
  var prev = null;           // échantillon précédent
  var total = 0;
  var t0 = 0;               // horodatage du premier échantillon (log relatif)
  var dirty = false;
  var lastEventTs = 0;
  var rate = { count: 0, since: 0 };
  var listenTs = 0;

  var sensor = 'accel';                           // 'accel' | 'gyro' | 'both'
  var gyroMode = 1;                               // 1 = vitesses angulaires, 2 = cumul par composante

  var steps = 0;                                  // pas détectés depuis le dernier reset
  var stepSens = 50;                              // sensibilité : 0 = stricte, 50 = référence, 100 = permissive
  var stepLp = null;                              // passe-bas de la norme (gravité + posture)
  var stepT = 0;                                  // horodatage du dernier échantillon traité
  var stepPeak = 0;                               // crête récente de la composante dynamique
  var stepPrevDyn = 0;                            // valeur précédente, pour exiger une montée
  var lastStepAt = 0;                             // horodatage du dernier pas retenu
  var stepGyroLp = { x: 0, y: 0, z: 0 };          // passe-bas de chaque axe (°/s)
  var stepGyroInit = false;                       // passe-bas amorcé
  var stepGyroT = 0;                              // horodatage du dernier échantillon gyroscopique
  var stepGyroPeak = 0;                           // crête récente de la rotation dynamique
  var stepGyroPrev = 0;                           // valeur précédente, pour exiger une montée
  var stepGyroAt = 0;                             // dernière montée côté gyroscope
  var gyroSeenAt = 0;                             // dernière donnée gyroscopique reçue
  var gyroSum = { x: 0, y: 0, z: 0 };             // totaux du mode cumul
  var gyroSensor = null;
  var lastOrient = null;

  function fmt(n) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    var s = n.toFixed(2);
    return (n >= 0 ? '+' : '') + s;
  }

  function setStatus(text, cls) {
    el.status.textContent = text;
    el.status.className = 'badge' + (cls ? ' ' + cls : '');
  }

  function motionAvailable() {
    return 'DeviceMotionEvent' in window;
  }

  function showHint(html) {
    el.hint.innerHTML = html;
    el.hint.hidden = false;
  }

  var flashTimer = null;
  function flash() {
    el.flash.classList.add('on');
    if (flashTimer) clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { el.flash.classList.remove('on'); }, 70);
  }

  /* ---------- détection de pas ----------
     Le pas est une oscillation de 1 à 3 Hz qui apparaît sur deux capteurs :
     la norme d'accélération m = √(x²+y²+z²) (≈ 9,81 au repos) et la vitesse
     angulaire |ω| = √(ωx²+ωy²+ωz²) (bassin/pendule du bras). Chaque source est
     traitée de la même façon, à ses unités près :

       a   = 1 − e^(−Δt/τhp)                    coefficient dépendant du pas de temps
       lp += (v − lp) · a                       passe-bas ≈ 0,5 Hz : gravité, posture, dérive
       dyn = v − lp                             composante dynamique du pas (oscille autour de 0)
       P   = max(P · e^(−Δt/τpic), dyn)         crête récente, décroissance lente
       θ   = borne(GAIN · P, MIN, MAX)          seuil adaptatif à l'allure

     Une « montée » est retenue quand dyn passe au-dessus de θ sans y être déjà
     (dyn > θ et valeur précédente ≤ θ) : une seule par oscillation. L'accéléromètre
     déclenche, le gyroscope confirme : une montée n'est comptée que si |ω| a connu
     une de ses propres montées il y a moins de MATCH ms. Cela rejette les chocs subis
     sans rotation (téléphone posé, transport secoué). Un gyroscope absent, muet ou
     trop faible (crête sous GYRO_MIN) est ignoré et l'accéléromètre décide seul.
     Enfin REFRACT ms séparent deux pas, soit 3,3 pas/s au maximum.              */
  var STEP_TAU_HP = 0.3;         // s : constante du passe-bas (coupure ≈ 0,53 Hz)
  var STEP_TAU_PEAK = 3.0;       // s : mémoire de la crête (auto-échelle sur l'allure)
  var STEP_GAIN = 0.4;           // seuil = 40 % de la crête récente
  var STEP_MIN = 0.6;            // m/s² : plancher, au-dessus du bruit à l'arrêt
  var STEP_MAX = 3.0;            // m/s² : plafond, contre les secousses
  var STEP_REFRACT = 300;        // ms : cadence maximale
  var STEP_GYRO_MIN = 20;        // °/s : plancher de la composante gyroscopique
  var STEP_GYRO_MAX = 150;       // °/s : plafond, contre les rotations volontaires
  var STEP_MATCH = 300;          // ms : écart maximal entre rotation et accélération
  var STEP_PRESENT = 500;        // ms : une source est considérée disponible
  var STEP_SENS_STRICT = 1.6;    // seuils ×1,6 quand la sensibilité est à 0
  var STEP_SENS_OPEN = 0.4;      // seuils ×0,4 quand elle est à 100

  // facteur appliqué aux seuils : < 1 = plus permissif, > 1 = plus strict
  function stepFactor() {
    return STEP_SENS_STRICT + (STEP_SENS_OPEN - STEP_SENS_STRICT) * stepSens / 100;
  }

  function countStep(raw) {
    if (raw - lastStepAt < STEP_REFRACT) return false;
    lastStepAt = raw;
    steps++;
    el.vsteps.textContent = steps.toLocaleString('fr-FR');
    flash();
    return true;
  }

  // montée de la composante dynamique de |a|
  function detectStep(mag, raw) {
    if (stepLp === null) { stepLp = mag; stepT = raw; return false; }
    var dtS = Math.min(0.1, Math.max(0.002, (raw - stepT) / 1000));
    stepT = raw;

    stepLp += (mag - stepLp) * (1 - Math.exp(-dtS / STEP_TAU_HP));
    var dyn = mag - stepLp;
    stepPeak = Math.max(stepPeak * Math.exp(-dtS / STEP_TAU_PEAK), dyn);
    var f = stepFactor();
    var threshold = Math.min(STEP_MAX * f, Math.max(STEP_MIN * f, STEP_GAIN * stepPeak * f));

    var crossed = dyn > threshold && stepPrevDyn <= threshold;
    stepPrevDyn = dyn;
    if (!crossed) return false;

    // gyroscope absent, muet ou trop faible : l'accéléromètre décide seul
    if (raw - gyroSeenAt > STEP_PRESENT || stepGyroPeak < STEP_GYRO_MIN) return countStep(raw);
    return raw - stepGyroAt <= STEP_MATCH ? countStep(raw) : false;
  }

  // rotation : le gyroscope confirme ou refuse la montée d'accélération
  function detectStepGyro(wx, wy, wz, raw) {
    if (!stepGyroInit) {
      stepGyroLp.x = wx; stepGyroLp.y = wy; stepGyroLp.z = wz;
      stepGyroInit = true; stepGyroT = raw;
      return;
    }
    var dtS = Math.min(0.1, Math.max(0.002, (raw - stepGyroT) / 1000));
    stepGyroT = raw;
    gyroSeenAt = raw;

    // passe-bas par axe, puis norme de ce qui reste : insensible à l'orientation
    var a = 1 - Math.exp(-dtS / STEP_TAU_HP);
    stepGyroLp.x += (wx - stepGyroLp.x) * a;
    stepGyroLp.y += (wy - stepGyroLp.y) * a;
    stepGyroLp.z += (wz - stepGyroLp.z) * a;

    var dx = wx - stepGyroLp.x, dy = wy - stepGyroLp.y, dz = wz - stepGyroLp.z;
    var dyn = Math.sqrt(dx * dx + dy * dy + dz * dz);
    stepGyroPeak = Math.max(stepGyroPeak * Math.exp(-dtS / STEP_TAU_PEAK), dyn);
    var f = stepFactor();
    var threshold = Math.min(STEP_GYRO_MAX * f, Math.max(STEP_GYRO_MIN * f, STEP_GAIN * stepGyroPeak * f));

    if (dyn > threshold && stepGyroPrev <= threshold) stepGyroAt = raw;
    stepGyroPrev = dyn;
  }

  /* ---------- capture ---------- */

  function onMotion(e) {
    var a = e.accelerationIncludingGravity || e.acceleration;
    if (!a || (a.x === null && a.y === null && a.z === null)) return;
    var x = a.x || 0, y = a.y || 0, z = a.z || 0;
    var raw = e.timeStamp || (window.performance && performance.now ? performance.now() : Date.now());
    ingest(x, y, z, raw, false);
  }

  function onGyroReading() {
    if (!gyroSensor) return;
    var raw = window.performance && performance.now ? performance.now() : Date.now();
    ingest(gyroSensor.x || 0, gyroSensor.y || 0, gyroSensor.z || 0, raw, true);
  }

  // repli si l'API Gyroscope n'existe pas : vitesse dérivée de l'orientation
  function onOrient(e) {
    if (e.beta === null && e.gamma === null) return;
    var raw = e.timeStamp || (window.performance && performance.now ? performance.now() : Date.now());
    if (lastOrient) {
      var dt = (raw - lastOrient.t) / 1000;
      if (dt > 0.001 && dt < 0.5) {
        var a0 = e.alpha === null ? 0 : e.alpha;
        var b0 = lastOrient.a === null ? 0 : lastOrient.a;
        ingest((e.beta - lastOrient.b) / dt, (e.gamma - lastOrient.g) / dt,
               (((a0 - b0) + 540) % 360 - 180) / dt, raw, true);
        lastOrient = { t: raw, b: e.beta, g: e.gamma, a: e.alpha };
        return;
      }
    }
    lastOrient = { t: raw, b: e.beta, g: e.gamma, a: e.alpha };
  }

  function ingest(x, y, z, raw, isGyro) {
    if (!t0) t0 = raw;

    // le gyroscope alimente la détection de pas même quand ses courbes ne s'affichent pas
    if (isGyro) detectStepGyro(x, y, z, raw);

    // en mode combiné, les vitesses angulaires ne s'affichent pas
    if (isGyro && sensor !== 'gyro') return;

    // second mode du gyroscope : chaque composante se cumule à elle-même
    if (isGyro && gyroMode === 2) {
      gyroSum.x += x; gyroSum.y += y; gyroSum.z += z;
      x = gyroSum.x; y = gyroSum.y; z = gyroSum.z;
    }

    var mag = Math.sqrt(x * x + y * y + z * z);
    var isStep = !isGyro && detectStep(mag, raw);

    var s = {
      t: raw - t0,
      x: x, y: y, z: z, mag: mag,
      step: isStep,
      d: prev ? mag - prev.mag : 0,
      dx: prev ? x - prev.x : 0,
      dy: prev ? y - prev.y : 0,
      dz: prev ? z - prev.z : 0
    };

    prev = s;
    samples.push(s);
    if (samples.length > MAX_SAMPLES) samples.shift();
    total++;
    s.n = total;
    dirty = true;

    lastEventTs = Date.now();
    rate.count++;
    if (!rate.since) rate.since = lastEventTs;
  }

  /* ---------- rendu ---------- */

  function drawChart() {
    var w = el.chart.width, h = el.chart.height;
    var pad = 8;
    ctx.clearRect(0, 0, w, h);

    // grille zéro
    ctx.strokeStyle = 'rgba(125,139,154,.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, h / 2);
    ctx.lineTo(w, h / 2);
    ctx.stroke();

    if (samples.length < 2) return;

    var n = samples.length;
    var maxAbs = 1;
    for (var i = 0; i < n; i++) {
      var s = samples[i];
      maxAbs = Math.max(maxAbs, Math.abs(s.x), Math.abs(s.y), Math.abs(s.z));
    }
    maxAbs = Math.ceil(maxAbs * 1.1);

    var stepX = (w - pad * 2) / (n - 1);
    var scale = (h - pad * 2) / 2 / maxAbs;
    var mid = h / 2;

    // trait vertical uniquement à l'instant d'un pas détecté
    ctx.strokeStyle = 'rgba(245,196,81,.65)';
    ctx.lineWidth = 1;
    for (var p = 0; p < n; p++) {
      if (!samples[p].step) continue;
      var markX = pad + p * stepX;
      ctx.beginPath();
      ctx.moveTo(markX, 0);
      ctx.lineTo(markX, h);
      ctx.stroke();
    }

    var series = [
      { key: 'x', color: '#ff5c7a' },
      { key: 'y', color: '#4ade80' },
      { key: 'z', color: '#4da3ff' }
    ];
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    for (var k = 0; k < series.length; k++) {
      var key = series[k].key;
      ctx.strokeStyle = series[k].color;
      ctx.beginPath();
      for (var j = 0; j < n; j++) {
        var px = pad + j * stepX;
        var py = mid - samples[j][key] * scale;
        if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
  }

  function render() {
    if (dirty && samples.length) {
      dirty = false;
      var last = samples[samples.length - 1];

      el.vx.textContent = fmt(last.x);
      el.vy.textContent = fmt(last.y);
      el.vz.textContent = fmt(last.z);
      el.dx.textContent = 'Δ ' + fmt(last.dx);
      el.dy.textContent = 'Δ ' + fmt(last.dy);
      el.dz.textContent = 'Δ ' + fmt(last.dz);
      el.vmag.textContent = fmt(last.mag).replace('+', '') + unitLabel();
      el.vdelta.textContent = fmt(last.d);
      el.vcount.textContent = total.toLocaleString('fr-FR');

      el.hint.hidden = true;
      drawChart();
    }

    requestAnimationFrame(render);
  }

  function tickRate() {
    if (!running) return;
    var now = Date.now();
    var span = now - rate.since;
    var hz = span > 300 ? (rate.count * 1000 / span) : 0;
    if (hz > 0) setStatus(Math.round(hz) + ' Hz', 'on');
    rate.count = 0;
    rate.since = now;

    if (now - lastEventTs > 2000 && lastEventTs > 0) {
      setStatus('aucune donnée', '');
    } else if (now - listenTs > 2500 && lastEventTs === 0) {
      setStatus('capteur muet', 'err');
      showHint(
        'Aucun événement reçu. Le capteur de mouvement du navigateur exige une page <b>HTTPS</b> ou <code>localhost</code>. ' +
        'Si tu ouvres le fichier en <code>file://</code>, sers-le avec <code>npx serve</code> ou <code>python3 -m http.server</code>.');
    }
  }

  /* ---------- contrôle ---------- */

  function requestPermission() {
    var DME = window.DeviceMotionEvent;
    if (DME && typeof DME.requestPermission === 'function') {
      return DME.requestPermission();
    }
    return Promise.resolve('granted');
  }

  function start() {
    if (!motionAvailable()) {
      setStatus('non supporté', 'err');
      showHint('Ce navigateur ne fournit pas <code>DeviceMotionEvent</code>. Ouvre la page dans Chrome sur Android.');
      return;
    }
    el.start.disabled = true;
    requestPermission().then(function (state) {
      el.start.disabled = false;
      if (state !== 'granted') {
        setStatus('refusé', 'err');
        return;
      }
      listenTs = Date.now();
      lastEventTs = 0;
      rate.since = 0;
      attachSource();
      running = true;
      el.start.textContent = 'Arrêter';
      el.start.classList.add('stop');
      setStatus('en attente…', '');
      tickInterval = setInterval(tickRate, 1000);
    }).catch(function () {
      el.start.disabled = false;
      setStatus('erreur', 'err');
    });
  }

  var tickInterval = null;

  function attachGyro() {
    var G = window.Gyroscope;
    if (G) {
      try {
        gyroSensor = new G({ frequency: 60 });
        gyroSensor.addEventListener('reading', onGyroReading);
        gyroSensor.addEventListener('error', function () {
          gyroSensor = null;
          if ('DeviceOrientationEvent' in window) window.addEventListener('deviceorientation', onOrient, { passive: true });
        });
        gyroSensor.start();
        return;
      } catch (err) {
        gyroSensor = null;
      }
    }
    if ('DeviceOrientationEvent' in window) {
      window.addEventListener('deviceorientation', onOrient, { passive: true });
    }
  }

  function attachSource() {
    if (sensor === 'gyro') {
      attachGyro();
      return;
    }
    window.addEventListener('devicemotion', onMotion, { passive: true });
    if (sensor === 'both') attachGyro();
  }

  function detachSource() {
    window.removeEventListener('devicemotion', onMotion);
    window.removeEventListener('deviceorientation', onOrient);
    if (gyroSensor) {
      try { gyroSensor.stop(); } catch (err) {}
      gyroSensor = null;
    }
    lastOrient = null;
  }

  function unitLabel() {
    if (sensor !== 'gyro') return ' m/s²';
    return gyroMode === 2 ? ' cumul' : ' °/s';
  }

  function syncLabels() {
    var segs = [['accel', el.segAccel], ['gyro', el.segGyro], ['both', el.segBoth]];
    for (var i = 0; i < segs.length; i++) {
      var on = segs[i][0] === sensor;
      segs[i][1].className = 'seg' + (on ? ' on' : '');
      if (segs[i][1].setAttribute) segs[i][1].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    el.segGyro.textContent = (sensor === 'gyro' && gyroMode === 2) ? 'Gyroscope Σ' : 'Gyroscope';
    el.title.textContent = sensor === 'accel' ? 'Accéléromètre'
      : (sensor === 'both' ? 'Accéléromètre + gyroscope'
        : (gyroMode === 2 ? 'Gyroscope — cumul' : 'Gyroscope'));
  }

  function setSensor(mode) {
    if (sensor === mode) return;
    var wasRunning = running;
    if (wasRunning) stop();
    sensor = mode;
    syncLabels();
    reset();
    setStatus('inactif', '');
    if (wasRunning) start();
  }

  // appui sur le bouton Gyroscope alors qu'il est déjà actif : change de mode
  function setGyroMode(mode) {
    if (gyroMode === mode) return;
    var wasRunning = running;
    if (wasRunning) stop();
    gyroMode = mode;
    gyroSum = { x: 0, y: 0, z: 0 };
    syncLabels();
    reset();
    setStatus('inactif', '');
    if (wasRunning) start();
  }

  function stop() {
    detachSource();
    running = false;
    el.start.textContent = 'Démarrer';
    el.start.classList.remove('stop');
    setStatus('en pause', '');
    if (tickInterval) { clearInterval(tickInterval); tickInterval = null; }
  }

  function reset() {
    samples = [];
    prev = null;
    gyroSum = { x: 0, y: 0, z: 0 };
    total = 0;
    t0 = 0;
    el.vx.textContent = el.vy.textContent = el.vz.textContent = '—';
    el.dx.textContent = el.dy.textContent = el.dz.textContent = 'Δ —';
    el.vmag.textContent = el.vdelta.textContent = '—';
    el.vcount.textContent = '0';
    steps = 0;
    stepLp = null;
    stepT = 0;
    stepPeak = 0;
    stepPrevDyn = 0;
    lastStepAt = 0;
    stepGyroLp = { x: 0, y: 0, z: 0 };
    stepGyroInit = false;
    stepGyroT = 0;
    stepGyroPeak = 0;
    stepGyroPrev = 0;
    stepGyroAt = 0;
    gyroSeenAt = 0;
    el.vsteps.textContent = '0';
    dirty = false;
    lastOrient = null;
    drawChart();
  }

  el.start.addEventListener('click', function () {
    if (running) stop(); else start();
  });
  el.reset.addEventListener('click', reset);

  if (!motionAvailable()) {
    setStatus('indisponible', 'err');
  }
  el.segAccel.addEventListener('click', function () { setSensor('accel'); });
  el.segGyro.addEventListener('click', function () {
    if (sensor === 'gyro') setGyroMode(gyroMode === 1 ? 2 : 1);
    else setSensor('gyro');
  });
  el.segBoth.addEventListener('click', function () { setSensor('both'); });
  el.stepSens.addEventListener('input', function () {
    stepSens = Number(el.stepSens.value);
    el.stepSensVal.textContent = String(stepSens);
  });
  stepSens = Number(el.stepSens.value);
  el.stepSensVal.textContent = String(stepSens);
  syncLabels();
  drawChart();
  requestAnimationFrame(render);

  // installation et ouverture hors-ligne
  if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator &&
      typeof window !== 'undefined' && window.isSecureContext) {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
